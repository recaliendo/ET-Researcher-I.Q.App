name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ET_DATA_DIR: ${{ runner.temp }}/et-data
      ET_SCHEDULER: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The private v0.8 research package is not in the repository; import tests skip and say so.
      - run: pnpm test
      - run: pnpm build
