# Render Blueprint: Docker web service + managed PostgreSQL.
# Apply at https://dashboard.render.com/blueprint/new?repo=https://github.com/recaliendo/ET-Researcher-I.Q.App
services:
  - type: web
    name: et-researcher-iq
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: et-researcher-iq-db
          property: connectionString
      # Role tokens are generated by Render (never committed). Copy ADMIN_TOKEN from the dashboard to sign in.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: EDITOR_TOKEN
        generateValue: true
      - key: READER_TOKEN
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      # Signs session cookies. Rotating it signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
      # Single instance: the in-process scheduler handles ingestion.
      - key: ET_SCHEDULER_MINUTES
        value: "15"
      - key: ALLOW_PRIVATE_AI
        value: "false"

databases:
  - name: et-researcher-iq-db
    plan: basic-256mb
    databaseName: et_research
    user: et_research
    ipAllowList: []  # internal connections only; add your IP temporarily to run the one-time import
